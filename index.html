<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPE Purchasing — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --bg2:#eef1f6; --card:#fff; --ink:#1b2431; --mut:#707b8c; --muted2:#98a2b3; --line:#e6eaf0;
  --navy:#16233f; --navy2:#1e3a63; --pri:#2f6fed; --pri2:#5b8df0; --pri-dark:#16233f; --accent:#2f6fed; --accentb:#eaf1fe;
  --ok:#16874f; --okb:#e3f7ec; --warn:#b3760a; --warnb:#fff3da; --bad:#c02e35; --badb:#fdeaea; --info:#2461c9; --infob:#e8f0fe;
  --purple:#7c3aed; --purpleb:#f1e9fe; --teal:#0d9488; --tealb:#e0f5f3; --orange:#c2660a; --orangeb:#fdf1de; --pink:#d6336c; --pinkb:#fce8f0;
  --shadow-sm:0 1px 2px rgba(20,30,60,.06); --shadow:0 4px 16px rgba(20,30,60,.08); --shadow-lg:0 16px 48px rgba(15,25,50,.22);
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}

/* ============ Sidebar ============ */
.side{width:264px;background:var(--navy);min-height:100vh;padding:26px 18px;flex-shrink:0;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;z-index:15}
.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:0 4px}
.side .brand .brand-logo{background:#fff;border-radius:9px;padding:6px 10px;display:flex;align-items:center;height:40px;flex:1;min-width:0}
.side .brand .side-close{display:none;margin-left:auto;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px}
.side .grp{font-size:10.5px;color:rgba(255,255,255,.4);text-transform:uppercase;font-weight:700;letter-spacing:.6px;margin:18px 10px 8px}
.side a{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;color:rgba(255,255,255,.68);font-size:13.5px;font-weight:600;margin-bottom:2px;cursor:pointer;transition:.15s}
.side a:hover{color:#fff;background:rgba(255,255,255,.06)}
.side a.on{background:rgba(255,255,255,.12);color:#fff}
.side a .cnt{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:8px}
.profile{margin-top:auto;padding-top:18px}
.profile .pcard{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
.profile .pcard:hover{background:rgba(255,255,255,.12)}
.profile .av{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.profile b{font-size:12.5px;display:block}
.profile span{font-size:11px;color:rgba(255,255,255,.55)}
.profile .pchev{color:rgba(255,255,255,.4);font-size:16px}
.side-tools a.stlink{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;color:rgba(255,255,255,.68);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.side-tools a.stlink:hover{color:#fff;background:rgba(255,255,255,.06)}
.side-overlay{display:none}

/* ============ Topbar (persistent) ============ */
.topbar2{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;position:sticky;top:0;z-index:6}
.topbar2 .hamb2{display:none;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0}
.topbar2 .tb-search{flex:1;position:relative;max-width:420px}
.topbar2 .tb-search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.topbar2 .tb-search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:13px}
.topbar2 .tb-spacer{flex:1}
.tb-bell{position:relative;background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0}
.tb-bell .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #fff}
.tb-bell.spin{animation:spin1 .8s linear infinite}
@keyframes spin1{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.tb-profile{position:relative;flex-shrink:0}
.tb-profile-btn{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:10px;font:inherit}
.tb-profile-btn:hover{background:var(--bg2)}
.tb-profile-btn .av{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tb-profile-btn b{font-size:13px}
.tb-menu{display:none;position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:170px;padding:6px;z-index:30}
.tb-menu.on{display:block}
.tb-menu a{display:block;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.tb-menu a:hover{background:var(--bg2)}
.tb-menu a.bad{color:var(--bad)}

/* ============ Dashboard stat tiles v2 ============ */
.stat2{display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden;padding:13px 13px}
.stat2 .stat-top{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px}
.stat2 .stat-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.stat2 .stat-headtext{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.stat2 .stat-title{font-weight:700;font-size:11px;color:var(--ink);line-height:1.25;overflow-wrap:break-word}
.stat2 .stat-headtext .badge{font-size:8.5px;padding:2px 6px;white-space:nowrap;align-self:flex-start}
.stat2 .stat-num{font-size:21px;font-weight:800;letter-spacing:-.4px}
.stat2 .stat-desc{color:var(--mut);font-size:10px;line-height:1.3}
.stat2 .stat-trend{position:absolute;right:10px;bottom:10px;font-size:13px;opacity:.5}

/* ============ Dashboard bottom row ============ */
.dash-bottom{display:flex;gap:20px;align-items:flex-start}
.dash-bottom>.card{margin-bottom:0}
.dash-bottom .qa-card{flex:0 0 260px}
.dash-bottom .act-card{flex:1;min-width:0}
.qa-btn{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qa-btn:last-child{margin-bottom:0}
.empty-hero{display:flex;align-items:center;gap:18px;padding:18px 6px}
.empty-hero .ic-wrap{position:relative;flex-shrink:0}
.empty-hero .ic-circ{width:64px;height:64px;border-radius:50%;background:var(--infob);display:flex;align-items:center;justify-content:center;font-size:26px}
.empty-hero .ic-badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 0 0 3px #fff}
.empty-hero b{display:block;font-size:14px;margin-bottom:2px}
.empty-hero span{color:var(--mut);font-size:12.5px}

/* ============ Top bar (mobile) + main ============ */
.mainwrap{flex:1;min-width:0}
main{max-width:1180px;margin:0 auto;padding:40px 44px 70px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px;font-weight:800;flex:1;letter-spacing:-.4px}
.top p{margin:0;color:var(--mut);width:100%;order:3;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:22px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat b{font-size:32px;display:block;font-weight:800;letter-spacing:-.6px}
.stat span{color:var(--mut);font-size:12.5px;font-weight:500}
.tw{overflow-x:auto;border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--mut);font-weight:700;background:#f7f9fc;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
tbody tr:nth-child(even){background:#fbfcfe}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover{background:var(--infob)}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--infob);color:var(--info)}.b-gray{background:#eceff3;color:#555}
.act{background:var(--warn);color:#fff;font-size:10.5px;border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:700;box-shadow:0 0 0 3px var(--warnb)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;color:var(--ink);transition:.13s;box-shadow:var(--shadow-sm);min-height:38px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.pri{background:linear-gradient(120deg,var(--pri),var(--pri2));border-color:var(--pri);color:#fff}
.btn.ok{background:linear-gradient(120deg,#15794a,var(--ok));border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{font:inherit;padding:8px 10px;border:1.5px solid #dbe1ea;border-radius:8px;background:#fff;max-width:100%;transition:.13s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 3px rgba(58,111,214,.15)}
textarea{width:100%;min-height:56px}
label.f{display:block;font-size:11.5px;color:var(--mut);margin:10px 0 4px;font-weight:600;letter-spacing:.2px}
.row{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:140px}
.ov{position:fixed;inset:0;background:rgba(12,20,40,.55);backdrop-filter:blur(1px);display:flex;align-items:flex-start;justify-content:center;padding:24px 10px;overflow:auto;z-index:20}
.box{position:relative;background:#fff;border-radius:16px;width:100%;max-width:820px;padding:20px;box-shadow:var(--shadow-lg)}
.modal-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:#f1f3f7;color:#333;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.modal-x:hover{background:#e2e5ec}
.box h3{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.2px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;margin:12px 0;font-size:13px;background:#f7f9fc;border-radius:var(--radius-sm);padding:12px}
.meta span{display:block;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.2px;margin-bottom:1px}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:12.5px;color:var(--pri);text-transform:uppercase;letter-spacing:.4px;font-weight:800}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 12px 16px;position:relative;font-size:12.5px}
.tl li:before{content:"";position:absolute;left:-6.5px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--pri2);box-shadow:0 0 0 3px #fff}
.tl small{color:var(--mut)}
.hint{color:var(--mut);font-size:12px}
.warnbox{background:var(--warnb);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:8px;border:1px solid #f3e0b0}
.decide{background:#f7f9fc;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-top:12px}
.lowest{background:var(--okb)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 14px}
.flow span{background:linear-gradient(120deg,#eef3fb,#e6edfa);color:var(--pri-dark);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow-sm)}
.flow i{color:var(--muted2);font-style:normal}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(6px);background:#161d2e;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none;box-shadow:var(--shadow-lg)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--mut);padding:24px;text-align:center;font-size:13px}

/* ============ Penyesuaian handphone ============ */
@media(max-width:1180px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  body{display:block}
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:82vw;max-width:300px;box-shadow:var(--shadow-lg)}
  .side.open{transform:translateX(0)}
  .side .brand .side-close{display:block}
  .side-overlay{display:none;position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:14}
  .side-overlay.on{display:block}
  .topbar2 .hamb2{display:block}
  .topbar2{padding:10px 12px;gap:8px}
  .topbar2 .tb-search{max-width:none}
  .topbar2 .tb-profile-btn b{display:block;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dash-bottom{flex-direction:column}
  .dash-bottom .qa-card{flex:1 1 auto}
  main{padding:16px 12px 60px}
}
@media(max-width:640px){
  main{padding:14px 10px 60px}
  .top h2{font-size:19px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:14px 14px}
  .stat b{font-size:23px}
  .card{padding:15px;border-radius:14px}
  .meta{grid-template-columns:repeat(2,1fr);padding:10px;gap:8px 10px}
  .row{flex-direction:column;align-items:stretch}
  .row>div{width:100%}
  .row input,.row select{width:100%}
  .row>button,.row>.btn{align-self:flex-start;width:auto}
  .ov{padding:0;align-items:flex-end}
  .box{max-width:100%;border-radius:18px 18px 0 0;max-height:94vh;overflow-y:auto;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .box h3{font-size:16.5px}
  th,td{padding:8px 8px;font-size:12.5px}
  .topbar2 .tb-search{display:none}
  .dash-bottom{flex-direction:column}
  .dash-bottom .qa-card{flex:1 1 auto}
}
@media(max-width:480px){
  .btns{flex-direction:column;align-items:stretch}
  .btns .btn{width:100%}
  .grid{grid-template-columns:1fr}
}

.authwrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.authbox{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:28px;width:100%;max-width:360px}
.authbox h2{margin:0 0 4px}
.authbox input{width:100%;margin-top:2px}
</style>
</head>
<body>
<div class="side" id="side">
  <div class="brand"><div class="brand-logo"><img id="sideLogo" alt="CPE Purchasing" style="max-width:100%;max-height:100%"></div><button class="side-close" onclick="toggleSide(false)">✕</button></div>
  <div id="navGroups"></div>
</div>
<div class="side-overlay" id="sideOverlay" onclick="toggleSide(false)"></div>
<div class="mainwrap">
  <div class="topbar2">
    <button class="hamb2" onclick="toggleSide(true)">☰</button>
    <div class="tb-search"><span class="ic">🔍</span><input id="tb-search-input" type="search" name="doc-search-q" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Cari PR, PO, atau nomor dokumen..." onkeydown="if(event.key==='Enter')doSearch()"></div>
    <div class="tb-spacer"></div>
    <button class="tb-bell" id="tb-refresh" title="Refresh data" onclick="manualRefresh()">🔄</button>
    <button class="tb-bell" title="Perlu tindakan" onclick="setTab('dashboard')"><span id="tb-bell-ic">🔔</span><span class="dot" id="tb-bell-dot" style="display:none"></span></button>
    <div class="tb-profile">
      <button class="tb-profile-btn" onclick="toggleTbMenu()"><div class="av" id="tbAv">?</div><b id="tbName"></b><span style="font-size:11px;color:var(--mut)">▾</span></button>
      <div class="tb-menu" id="tbMenu">
        <a id="tb-menu-sig" onclick="toggleTbMenu(false);manageSignatures()">🛡️ Tanda Tangan</a>
        <a id="tb-menu-pass" onclick="toggleTbMenu(false);changePassword()">🔑 Ganti Password</a>
        <a class="bad" id="tb-menu-logout" onclick="toggleTbMenu(false);doLogout()">⎋ Keluar</a>
      </div>
    </div>
  </div>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="authScreen" class="authwrap" style="display:none">
  <div class="authbox">
    <img id="authLogo" alt="PT Citra Patra Energi" style="max-width:220px;height:auto;display:block;margin-bottom:10px">
    <div class="hint" style="margin-bottom:10px">Masuk dengan akun yang diberikan admin.</div>
    <label class="f">Akun</label><select id="auth-email" autocomplete="username"><option value="">Pilih akun</option></select>
    <label class="f">Password</label><input id="auth-pass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="authErr" class="warnbox" style="display:none"></div>
    <div class="btns" style="margin-top:14px"><button class="btn pri" style="width:100%" onclick="doLogin()">Masuk</button></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="guestView()">👁 Lihat Saja (Tanpa Login)</button>
    <div class="hint" style="margin-top:8px;text-align:center">Mode lihat saja — hanya bisa melihat data, tidak bisa membuat, menyetujui, atau mengubah apa pun.</div>
  </div>
</div>

function parseNum(v){ if(typeof v==='number') return v; let s=String(v||'').trim().replace(/[^\d.,-]/g,''); if(!s) return 0; s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; }
function fmtInput(el){
  const meaningfulBefore = el.value.slice(0, el.selectionStart||0).replace(/[^\d,]/g,'').length;
  const raw = el.value.replace(/[^\d,]/g,'');
  const c = raw.indexOf(',');
  const intPart = c===-1 ? raw : raw.slice(0,c);
  const decPart = c===-1 ? null : raw.slice(c+1).replace(/,/g,'');
  const formattedInt = intPart ? Number(intPart).toLocaleString('id-ID') : '';
  el.value = decPart===null ? formattedInt : formattedInt+','+decPart;
  let seen=0, pos=el.value.length;
  for(let i=0;i<el.value.length;i++){ if(/[\d,]/.test(el.value[i])) seen++; if(seen>=meaningfulBefore){ pos=i+1; break; } }
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}

async function loadFromSupabase(){
  const [prsR,wrsR,srcR,posR,sigR,seqR,catR,supR] = await Promise.all([
    sb.from('prs').select('*').order('date',{ascending:false}),
    sb.from('wrs').select('*').order('date',{ascending:false}),
    sb.from('src').select('*').order('date',{ascending:false}),
    sb.from('pos').select('*').order('date',{ascending:false}),
    sb.from('signatures').select('*'),
    sb.from('doc_seq').select('*'),
    sb.from('catalog').select('code,name,uom,stock'),
    sb.from('suppliers').select('name,address,fax,attn')
  ]);
  const S2 = emptyState();
  if(prsR.data) S2.prs = prsR.data.map(toPR);
  if(wrsR.data) S2.wrs = wrsR.data.map(toWR);
  if(srcR.data) S2.src = srcR.data.map(toSRC);
  if(posR.data) S2.pos = posR.data.map(toPO);
  if(sigR.data) sigR.data.forEach(r=>{ S2.signatures[r.role]=r.data_url; });
  if(seqR.data) seqR.data.forEach(r=>{ S2.seq[r.doc_type]=r.value; });
  if(catR.data && catR.data.length) S2.catalog = catR.data.map(r=>({code:r.code,name:r.name,uom:r.uom||'pcs',stock:Number(r.stock)||0}));
  if(supR && supR.data) S2.suppliers = supR.data.map(r=>({name:r.name,address:r.address||'',fax:r.fax||'',attn:r.attn||''}));
  if(!S2.signatures.mgmt1) S2.signatures.mgmt1 = DEFAULT_SIGNATURES.mgmt1;
  if(!S2.signatures.mgmt2) S2.signatures.mgmt2 = DEFAULT_SIGNATURES.mgmt2;
  S = S2;

let saving = false, savePending = false;
async function save(){
  if(saving){ savePending = true; return; }
  saving = true;
  try{
    let firstErr = null;
    const run = async (ops) => {
      if(!ops.length) return;
      const results = await Promise.all(ops);
      const bad = results.find(r=>r && r.error);
      if(bad && !firstErr) firstErr = bad.error;
    };
    // prs/wrs are the root documents that src rows reference (by src_id/ref), and src rows
    // are in turn referenced by pos.src_id via a foreign key — so these MUST be saved in this
    // order, awaited one group at a time, not fired all at once with Promise.all. Saving them
    // concurrently can let a new "pos" row reach the server before its "src" row has committed,
    // which trips the pos_src_id_fkey constraint.
    await run([
      S.prs.length ? sb.from('prs').upsert(S.prs.map(fromPR)) : null,
      S.wrs.length ? sb.from('wrs').upsert(S.wrs.map(fromWR)) : null,
    ].filter(Boolean));
    await run([ S.src.length ? sb.from('src').upsert(S.src.map(fromSRC)) : null ].filter(Boolean));
    await run([ S.pos.length ? sb.from('pos').upsert(S.pos.map(fromPO)) : null ].filter(Boolean));
    // Everything below is independent of the above and of each other — fine to run in parallel.
    const sigRows = Object.entries(S.signatures||{}).filter(([k,v])=>v).map(([role,data_url])=>({role,data_url}));
    const seqRows = Object.entries(S.seq||{}).map(([doc_type,value])=>({doc_type,value}));
    await run([
      sigRows.length ? sb.from('signatures').upsert(sigRows) : null,
      seqRows.length ? sb.from('doc_seq').upsert(seqRows) : null,
      (S.catalog && S.catalog.length) ? sb.from('catalog').upsert(S.catalog.map(c=>({code:c.code,name:c.name,uom:c.uom,stock:c.stock}))) : null,
      (S.suppliers && S.suppliers.length) ? sb.from('suppliers').upsert(S.suppliers.map(x=>({name:x.name,address:x.address||null,fax:x.fax||null,attn:x.attn||null}))) : null,
    ].filter(Boolean));
    if(firstErr){ console.error(firstErr); toast('Gagal menyimpan ke server: '+firstErr.message); }
  }catch(e){ console.error(e); toast('Gagal menyimpan ke server (cek koneksi)'); }
  saving = false;
  if(savePending){ savePending = false; save(); }
}

function can(r){ return role===r || role==='admin'; }

function nextNo(type){
  S.seq[type] = (S.seq[type]||0)+1;
  const n = String(S.seq[type]).padStart(3,'0');
  const y = new Date().toISOString().slice(2,4)+new Date().toISOString().slice(5,7);
  return type==='PO' ? `PO/CPE/${y}/${n}` : `${type}-${y}-${n}`;
}
const coll = t => ({pr:S.prs,wr:S.wrs,src:S.src,po:S.pos}[t]);
const find = (t,id) => coll(t).find(x=>x.id===id);
function mkSrc(srcType,doc,items){
  const s = {id:uid(),no:nextNo('SRC'),srcType,srcId:doc.id,refNo:doc.no,date:iso(),items,quotes:[],status:'OPEN',poId:null,poIds:[],itemStatus:items.map(()=>null),history:[]};
  hist(s,'Masuk antrian Purchasing','Sumber: '+doc.no);
  S.src.unshift(s); return s;
}
function srcItemStatus(s){
  if(!s.itemStatus || s.itemStatus.length!==s.items.length) s.itemStatus = s.items.map(()=>null);
  return s.itemStatus;
}
function srcOutstandingIdx(s){ return srcItemStatus(s).reduce((a,v,i)=>{ if(!v && !(s.items[i]&&s.items[i].needsClarify)) a.push(i); return a; },[]); }
function prReadyToClose(pr){
  const s = S.src.find(x=>x.srcType==='PR' && x.srcId===pr.id);
  if(!s) return false;
  if(srcOutstandingIdx(s).length>0) return false;
  const poIds = (s.poIds&&s.poIds.length) ? s.poIds : (s.poId?[s.poId]:[]);
  if(!poIds.length) return false;
  return poIds.every(pid=>{ const po=find('po',pid); return po && ['APPROVED','SENT','RECEIVED'].includes(po.status); });
}
function poCurrentApproverKey(po){
  if(po.status==='PENDING_MGMT') return 'mgmt1';
  if(po.status==='PENDING_DIRECTOR') return 'mgmt2';
  return po.needsDirector ? 'mgmt2' : 'mgmt1';
}
function isActionable(t,d){
  if(t==='pr'||t==='wr'){
    if(d.status==='PENDING_USER') return canApproveDept(d.dept);
    if(t==='pr' && d.status==='PENDING_PM') return can('mgmt1');
    if(t==='pr' && d.status==='PENDING_DIRECTOR') return can('mgmt2');
    if(t==='wr' && d.status==='WH_PROCESS') return can('warehouse');
    if(d.status==='REJECTED') return can('user') || can('planner');
    return false;
  }
  if(t==='src') return d.status==='OPEN' && can('purchasing');
  if(t==='po'){ if(d.status==='PENDING_MGMT') return can('mgmt1'); if(d.status==='PENDING_DIRECTOR') return can('mgmt2'); if(d.status==='PENDING_FINANCE') return can('finance'); if(d.status==='APPROVED') return can('purchasing'); if(d.status==='SENT') return can('warehouse'); }
  return false;
}
const countAct = t => coll(t).filter(d=>isActionable(t,d)).length;

function uploadSignature(rk,input){
  const file=input.files&&input.files[0]; if(!file) return;
  if(typeof FileReader==='undefined') return toast('Upload tanda tangan tidak didukung di lingkungan ini');

  reader.onload=()=>{ S.signatures[rk]=reader.result; save(); manageSignatures(); toast('Tanda tangan tersimpan'); };
  reader.onerror=()=>toast('Gagal membaca file tanda tangan');
  reader.readAsDataURL(file);

  if(!code||!name||!uom) return toast('Kode, nama, dan satuan wajib diisi');

  save(); closeModal(); render(); toast('Item katalog disimpan');
}

function openDataUrl(dataUrl){
  try{
    const m = /^data:([^;]+);base64,(.*)$/s.exec(dataUrl);
    if(!m) return window.open(dataUrl,'_blank');
    const mime = m[1], b64 = m[2];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr],{type:mime});
    const url = URL.createObjectURL(blob);
    window.open(url,'_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('Gagal membuka dokumen'); }
}
const fileLink = (name,data) => data ? `<button type="button" class="btn sm" onclick="openDataUrl('${data}')">👁 ${esc(name&&name.length>16?name.slice(0,14)+'…':name||'Lihat')}</button>` : '<span class="hint">-</span>';
function readFileAsDataUrl(file){
  return new Promise(res=>{
    if(!file || typeof FileReader==='undefined') return res(null);
    const r=new FileReader();
    r.onload=()=>res({name:file.name,data:r.result});
    r.onerror=()=>res(null);
    r.readAsDataURL(file);
  });
}

      } else h += `<div class="warnbox">Sudah disetujui Manajemen. Menunggu Tim Finance memproses pembayaran sebelum PO PDF dapat diterbitkan & dibagikan ke supplier.</div>`;
    }

      h += `<div class="btns"><button class="btn bad" onclick="pdfPO('${d.id}',true)">Unduh PO PDF (Urgent – belum disetujui/dibayar)</button></div><div class="hint" style="margin-top:6px">Khusus kondisi mendesak. PDF akan ditandai "DRAFT – BELUM DISETUJUI/DIBAYAR" dan tercatat di riwayat PO.</div>`;
    }

      h += `<div class="btns"><button class="btn pri" onclick="pdfPO('${d.id}')">Unduh PO PDF</button></div><div class="hint" style="margin-top:6px">Sudah disetujui Manajemen (tertanda tangani) — tinggal menunggu Finance memproses pembayaran sebelum dibagikan ke supplier.</div>`;
    }
    if(d.status==='APPROVED'||d.status==='SENT'||d.status==='RECEIVED'){
      h += `<div class="btns"><button class="btn pri" onclick="pdfPO('${d.id}')">Unduh PO PDF</button>${d.status==='APPROVED'&&can('purchasing')?`<button class="btn ok" onclick="markSent('${d.id}')">Tandai sudah dikirim ke supplier</button>`:''}</div><div class="hint" style="margin-top:6px">Pembayaran sudah diproses Finance — PDF ini yang dibagikan ke supplier untuk diproses pengiriman.</div>`;

        h += `<div class="decide"><b>Konfirmasi Penerimaan Barang (Closing PO)</b>
          <div class="hint">Diterima oleh: <b>${esc(actorName())}</b> (Crew Warehouse)</div>
          <label class="f">Foto Barang Diterima</label><input type="file" id="recv-photos" accept="image/*" multiple>

      const rc = d.receiving;

        <div class="hint">Diterima: ${dt(rc.receivedAt)} — oleh <b>${esc(rc.receivedBy||'-')}</b> (Crew Warehouse), diketahui <b>${esc(rc.glName||'-')}</b> (Warehouse GL)</div>

        ${rc.suratJalan?`<div style="margin-top:8px">${fileLink(rc.suratJalan.name,rc.suratJalan.data)}</div>`:''}

    }
    if(can('purchasing') && !['REJECTED','RECEIVED','CANCELLED'].includes(d.status)) h += cancelBox('po',d.id);
    h += timeline(d);
  }
  h += `<div class="btns" style="margin-top:14px">${role==='admin'?`<button class="btn bad" onclick="deleteDoc('${t}','${d.id}')">🗑 Hapus Dokumen (Admin)</button>`:''}<button class="btn" onclick="closeModal()">Tutup</button></div>`;
  showModal(h);
}

function addPRRow(existing){
  const existingImgHtml = (existing && existing.imageData) ? fileLink(existing.imageName||'Gambar',existing.imageData) : '<span class="hint">-</span>';
  $('#rows').insertAdjacentHTML('beforeend',`<div class="row"><input class="i-name grow" placeholder="Nama item"><input class="i-spec grow" placeholder="Spesifikasi / merk / part no."><input class="i-qty" inputmode="decimal" placeholder="Qty" style="width:80px"><input class="i-uom" placeholder="Sat" style="width:70px"><span class="i-img-exist" style="min-width:60px">${existingImgHtml}</span><input type="file" class="i-img" accept="image/*" title="Upload gambar kebutuhan" style="width:110px"><button class="btn sm bad" onclick="this.parentElement.remove()">✕</button></div>`);
  if(existing && existing.imageData){ const row=$('#rows').lastElementChild; row.dataset.existingImg=existing.imageData; row.dataset.existingImgName=existing.imageName||'Gambar'; }
}
async function collectPRItemsWithImages(){
  const rows=[...document.querySelectorAll('#rows .row')];
  const items = await Promise.all(rows.map(async r=>{
    const name=r.querySelector('.i-name').value.trim(); const qty=parseNum(r.querySelector('.i-qty').value);
    if(!name||!qty) return null;
    const imgInput=r.querySelector('.i-img'); const file=imgInput&&imgInput.files&&imgInput.files[0];
    let imageData=r.dataset.existingImg||null, imageName=r.dataset.existingImgName||null;
    if(file){ const read=await readFileAsDataUrl(file); if(read){ imageData=read.data; imageName=read.name; } }
    return {name,spec:r.querySelector('.i-spec').value.trim(),qty,uom:r.querySelector('.i-uom').value.trim()||'pcs',imageData,imageName};
  }));
  return items.filter(Boolean);
}
async function submitPR(){
  const items = await collectPRItemsWithImages();
  const requester=$('#f-requester').value.trim(); const unitCode=$('#f-unit').value.trim(); const dept=$('#f-dept').value; const purpose=$('#f-note').value.trim();
  if(!requester) return toast('Isi nama pemohon');

  if(!dept) return toast('Pilih departemen');
  if(!purpose) return toast('Isi keperluan / alasan permintaan');
  if(!items.length) return toast('Isi minimal satu item dengan qty lebih dari 0');
  const d={id:uid(),no:nextNo('PR'),date:iso(),requester,unitCode,dept,purpose,priority:$('#f-prio').value,needBy:$('#f-need').value,items,status:'PENDING_USER',history:[]};
  hist(d,'Diajukan','Menunggu approval '+deptHeadLabel(dept));
  S.prs.unshift(d); closeModal(); save(); setTab('pr'); toast(d.no+' diajukan');
}

function wrCatalogDatalist(){
  const old=$('#dl-catalog'); if(old) old.remove();

/* ============ Approval PR / WR ============ */
function decide(act){
  const {type:t,id}=current; const d=find(t,id);
  const note=($('#note')?.value||'').trim();
  if(t==='po') return decidePO(act,note);
  if(act==='reject' && !note) return toast('Catatan wajib diisi saat menolak');
  if(d.status==='PENDING_USER'){
    const headLabel = deptHeadLabel(d.dept);
    const headName = actorName();
    d.deptHeadName = headName;
    if(act==='approve'){
      if(t==='wr'){ d.status='WH_PROCESS'; hist(d,'Disetujui '+headLabel,note,headName); }
      else { d.status='PENDING_PM'; hist(d,'Disetujui '+headLabel,note,headName); }
    }
    else { d.status='REJECTED'; hist(d,'Ditolak '+headLabel,note,headName); }
  } else if(d.status==='PENDING_PM'){
    if(act==='approve'){ d.status='PENDING_DIRECTOR'; hist(d,'Disetujui Project Manajer','Diteruskan ke Direktur Operation'); }
    else { d.status='REJECTED'; hist(d,'Ditolak Project Manajer',note); }
  } else if(d.status==='PENDING_DIRECTOR'){
    if(act==='approve'){ d.status='SOURCING'; mkSrc('PR',d,d.items.map(i=>({name:i.name,spec:i.spec,qty:i.qty,uom:i.uom}))); hist(d,'Disetujui Direktur Operation','Diteruskan ke Purchasing untuk quotation'); }
    else { d.status='REJECTED'; hist(d,'Ditolak Direktur Operation',note); }
  }
  refresh(); toast('Tersimpan');
}

/* ============ Warehouse issue ============ */
function issueWR(){
  const w=find('wr',current.id); const inputs=[...document.querySelectorAll('.iss')];
  let anyIssued=false; const shortItems=[];
  w.items.forEach((it,i)=>{
    const c=S.catalog.find(x=>x.code===it.code);
    const q=Math.max(0,Math.min(parseNum(inputs[i].value),it.qty,c.stock));
    it.issued=q; it.short=it.qty-q; c.stock=Math.round((c.stock-q)*1000)/1000;
    if(q>0) anyIssued=true;
    if(it.short>0) shortItems.push({name:it.name,spec:it.code,qty:it.short,uom:it.uom});
  });
  if(!shortItems.length){ w.status='ISSUED'; hist(w,'Barang di-issue','Semua item ready'); }
  else {
    w.status=anyIssued?'PARTIAL':'SOURCING';
    hist(w,anyIssued?'Issue sebagian':'Tidak ada item ready',`${shortItems.length} item tidak ready diteruskan ke Purchasing`);
    mkSrc('WR',w,shortItems);
  }
  refresh(); toast(shortItems.length?'Item tidak ready diteruskan ke Purchasing':'Semua item di-issue');
}

const qTotal = (src,q) => src.items.reduce((s,it,i)=>s+it.qty*(q.prices[i]||0),0);
const qTotalOutstanding = (src,q) => srcOutstandingIdx(src).reduce((s,i)=>s+(q.prices[i]>0?src.items[i].qty*q.prices[i]:0),0);
const coverCountQ = (src,q) => srcOutstandingIdx(src).filter(i=>q.prices[i]>0).length;
function knownSuppliers(){
  const names = new Set(SUPPLIERS);
  (S.suppliers||[]).forEach(x=>names.add(x.name));
  return [...names].sort((a,b)=>a.localeCompare(b));
}
function fillSupplierInfo(name){
  const sup = (S.suppliers||[]).find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase());
  if(!sup) return;
  if($('#q-addr') && !$('#q-addr').value.trim()) $('#q-addr').value = sup.address||'';
  if($('#q-fax') && !$('#q-fax').value.trim()) $('#q-fax').value = sup.fax||'';
  if($('#q-attn') && !$('#q-attn').value.trim()) $('#q-attn').value = sup.attn||'';
}
function rememberSupplier(q){
  if(!q.supplier) return;
  const existing = (S.suppliers||[]).find(x=>x.name.toLowerCase()===q.supplier.toLowerCase());
  if(existing){
    existing.name = q.supplier;
    if(q.address) existing.address = q.address;
    if(q.fax) existing.fax = q.fax;
    if(q.attn) existing.attn = q.attn;
  } else {
    S.suppliers = S.suppliers||[];
    S.suppliers.push({name:q.supplier, address:q.address||'', fax:q.fax||'', attn:q.attn||''});
  }
}

function submitQuote(srcId){

function updatePpnAuto(srcId){
  const s=find('src',srcId); if(!s) return;
  const sel=document.querySelector('input[name=win]:checked');
  const q = sel ? s.quotes.find(x=>x.id===sel.value) : s.quotes.find(x=>coverCountQ(s,x)>0);
  if(!q) return;
  const subtotal=qTotalOutstanding(s,q);
  const discount=parseNum($('#po-disc')?.value);
  const ppnOn=$('#po-ppn-on')?.checked!==false;
  const rate=parseNum($('#po-ppn-rate')?.value ?? '11');
  const dpp=Math.max(0,subtotal-discount);
  const amtField=$('#po-ppn-amt');
  if(amtField) amtField.value = ppnOn ? fmt(Math.round(dpp*rate/100)) : '0';
}
function createPO(srcId){
  const s=find('src',srcId); const sel=document.querySelector('input[name=win]:checked');
  if(!sel) return toast('Pilih quotation pemenang');
  const q=s.quotes.find(x=>x.id===sel.value);
  if(!q) return;
  const itemStatus = srcItemStatus(s);
  const targetIdx = srcOutstandingIdx(s).filter(i=>q.prices[i]>0);
  if(!targetIdx.length) return toast('Quotation ini tidak mencakup item yang masih outstanding');
  const fullCoverQuotes = s.quotes.filter(x=>coverCountQ(s,x)===srcOutstandingIdx(s).length);
  const lowest = fullCoverQuotes.length ? Math.min(...fullCoverQuotes.map(x=>qTotalOutstanding(s,x))) : null;
  const isFull = coverCountQ(s,q)===srcOutstandingIdx(s).length;
  const reason=$('#po-reason').value.trim();
  if(isFull && lowest!==null && qTotalOutstanding(s,q)>lowest && !reason) return toast('Isi alasan pemilihan karena bukan quotation termurah');
  const narrative=($('#po-narrative')?.value||'').trim();
  if(!narrative) return toast('Isi naratif PO (alasan/keperluan pembelian)');
  const discount=parseNum($('#po-disc').value), shipping=parseNum($('#po-ship').value);
  const ppnOn=$('#po-ppn-on')?.checked!==false; const ppnRate=parseNum($('#po-ppn-rate')?.value ?? '11');
  const ppn=ppnOn?parseNum($('#po-ppn-amt')?.value):0;
  const items=targetIdx.map(i=>({name:s.items[i].name,spec:s.items[i].spec,qty:s.items[i].qty,uom:s.items[i].uom,price:q.prices[i]}));
  const subtotal=items.reduce((a,it)=>a+it.qty*it.price,0);
  const dpp=Math.max(0,subtotal-discount);
  const total=dpp+ppn+shipping;
  if(total<=0) return toast('Total PO tidak valid');
  const refDoc=(s.srcType==='PR'?S.prs:S.wrs).find(x=>x.id===s.srcId);
  const deptReq = refDoc?refDoc.dept:'-';
  const purpose = refDoc?refDoc.purpose:'';
  const needsDirector = total>LIMIT;
  const po={id:uid(),no:nextNo('PO'),srcId:s.id,supplier:q.supplier,supplierAddress:q.address||'',supplierFax:q.fax||'',supplierAttn:q.attn||'',quoteNo:q.quoteNo||'',quoteFileName:q.fileName||'',quoteFileData:q.fileData||'',deptReq,purpose,narrative,leadDays:q.leadDays,items,discount,ppnRate:ppnOn?ppnRate:0,ppn,shipping,subtotal,total,reason,date:iso(),needsDirector,status:'PENDING_MGMT',history:[]};
  hist(po,'PO dibuat',`Diajukan ke ${ROLES.mgmt1.name} (Project Manajer)`);
  S.pos.unshift(po);
  targetIdx.forEach(i=>{ itemStatus[i]={poId:po.id}; });
  s.itemStatus = itemStatus;
  s.poIds = (s.poIds||[]).concat([po.id]); s.poId=po.id; s.chosen=q.id;
  const stillOutstanding = srcOutstandingIdx(s).length>0;
  s.status = stillOutstanding ? 'OPEN' : 'PO_CREATED';
  const itemNames = items.map(it=>it.name).join(', ');
  hist(s,'PO dibuat untuk sebagian item'+(stillOutstanding?' (masih ada item outstanding)':' (semua item tercakup)'),po.no+' — '+itemNames);
  if(s.srcType==='PR'){ const pr=find('pr',s.srcId); if(pr){ pr.status='PO_PROCESS'; hist(pr,'PO dibuat',po.no+(stillOutstanding?' — sebagian item, sisanya masih outstanding':'')); } }
  else { const wr=find('wr',s.srcId); if(wr) hist(wr,'PO dibuat untuk item tidak ready',po.no); }
  save(); openDoc('po',po.id); render(); toast(po.no+' menunggu approval'+(stillOutstanding?' — item lain tetap outstanding':''));
}
function resetSrcAfterRejectPO(po,note,who){
  const s=S.src.find(x=>x.id===po.srcId);
  if(!s) return;
  const itemStatus = srcItemStatus(s);
  let reverted = 0;
  itemStatus.forEach((v,i)=>{ if(v && v.poId===po.id){ itemStatus[i]=null; reverted++; } });
  s.itemStatus = itemStatus;
  s.poIds = (s.poIds||[]).filter(pid=>pid!==po.id);
  s.status='OPEN'; s.poId = s.poIds.length?s.poIds[s.poIds.length-1]:null; s.chosen=null;
  hist(s,'PO ditolak '+who,note+(reverted?` — ${reverted} item kembali outstanding`:''));
  if(s.srcType==='PR'){ const pr=find('pr',s.srcId); if(pr){ pr.status='SOURCING'; hist(pr,'PO ditolak '+who,note); } }
  else { const wr=find('wr',s.srcId); if(wr) hist(wr,'PO ditolak '+who,note); }
}
function decidePO(act,note){
  const po=find('po',current.id);
  if(po.status==='PENDING_MGMT'){
    if(!can('mgmt1')) return toast('Hanya '+ROLES.mgmt1.name+' yang dapat memutuskan PO ini');
    if(act==='reject'){
      if(!note) return toast('Catatan wajib diisi saat menolak');
      po.status='REJECTED'; hist(po,'Ditolak Project Manajer',note);
      resetSrcAfterRejectPO(po,note,'Project Manajer');
    } else if(po.needsDirector){
      po.status='PENDING_DIRECTOR'; hist(po,'Disetujui Project Manajer','Diteruskan ke '+ROLES.mgmt2.name+' (nilai PO di atas '+rp(LIMIT)+')'+(note?' — '+note:''));
    } else {
      po.status='PENDING_FINANCE'; hist(po,'Disetujui Project Manajer','Diteruskan ke Finance untuk proses pembayaran'+(note?' — '+note:''));
    }
  } else if(po.status==='PENDING_DIRECTOR'){
    if(!can('mgmt2')) return toast('Hanya '+ROLES.mgmt2.name+' yang dapat memutuskan PO ini');
    if(act==='reject'){
      if(!note) return toast('Catatan wajib diisi saat menolak');
      po.status='REJECTED'; hist(po,'Ditolak Direktur Operation',note);
      resetSrcAfterRejectPO(po,note,'Direktur Operation');
    } else {
      po.status='PENDING_FINANCE'; hist(po,'Disetujui Direktur Operation','Diteruskan ke Finance untuk proses pembayaran'+(note?' — '+note:''));
    }
  } else if(po.status==='PENDING_FINANCE'){
    if(!can('finance')) return toast('Hanya Tim Finance yang dapat memproses PO ini');
    if(act==='reject'){
      if(!note) return toast('Catatan wajib diisi saat menolak');
      po.status='REJECTED'; hist(po,'Ditolak Finance',note);
      resetSrcAfterRejectPO(po,note,'Finance');
    } else {
      const method=($('#pay-method')?.value)||'Transfer Bank'; const ref=($('#pay-ref')?.value||'').trim();
      const fileInput=document.querySelector('#pay-proof'); const file=fileInput&&fileInput.files&&fileInput.files[0];
      const finalizePayment = (proof) => {
        po.payment={method,ref,date:iso(),proofName:proof?proof.name:null,proofData:proof?proof.data:null};
        po.status='APPROVED'; hist(po,'Pembayaran diproses Finance',`${method}${ref?(' — Ref: '+ref):''}${proof?' — bukti: '+proof.name:''}`+(note?' — '+note:''));
        const s=S.src.find(x=>x.id===po.srcId);
        if(s){ if(s.srcType==='PR'){ const pr=find('pr',s.srcId); if(pr){ if(prReadyToClose(pr)){ pr.status='CLOSED'; hist(pr,'Semua item PR sudah di-PO & dibayar — PR ditutup',po.no); } else { hist(pr,'PO dibayar',po.no+' — masih ada item lain yang outstanding/menunggu PO'); } } } else { const wr=find('wr',s.srcId); if(wr) hist(wr,'PO terbit',po.no); } }
        refresh(); toast('Tersimpan');
      };
      if(file && typeof FileReader!=='undefined'){
        const reader=new FileReader();
        reader.onload=()=>finalizePayment({name:file.name,data:reader.result});
        reader.onerror=()=>{ toast('Gagal membaca file bukti pembayaran, disimpan tanpa bukti'); finalizePayment(null); };
        reader.readAsDataURL(file);
      } else finalizePayment(null);
      return;
    }
  }
  refresh(); toast(act==='approve'?'Tersimpan':'PO ditolak');
}

async function receivePO(id){
  const po=find('po',id);
  if(!can('warehouse')) return toast('Hanya Warehouse yang dapat memproses penerimaan barang');
  const glName=($('#recv-gl')?.value||'').trim();

  const sjFile = sjInput && sjInput.files && sjInput.files[0];
  const readFile = file => new Promise(res=>{
    if(!file || typeof FileReader==='undefined') return res(null);
    const r=new FileReader();
    r.onload=()=>res({name:file.name,data:r.result});
    r.onerror=()=>res(null);
    r.readAsDataURL(file);
  });
  const photos = (await Promise.all(photoFiles.map(readFile))).filter(Boolean);

function xlsxReady(){ return !!(window.XLSX); }

function autoWidth(rows){
  if(!rows.length) return [];
  const keys = Object.keys(rows[0]);
  return keys.map(k=>{
    const maxLen = Math.max(k.length, ...rows.map(r=>String(r[k]??'').length));
    return {wch: Math.min(Math.max(maxLen+2,10),45)};
  });
}

/* ============ Login, logout, realtime sync ============ */
function showAuthScreen(msg){
  $('#authScreen').style.display = 'flex';
  document.querySelector('.mainwrap').style.display = 'none';
  $('#side').classList.remove('open');
  const e = $('#authErr');
  if(msg){ e.style.display='block'; e.textContent = msg; } else { e.style.display='none'; }
}
function hideAuthScreen(){
  $('#authScreen').style.display = 'none';
  document.querySelector('.mainwrap').style.display = '';
}
const AUTH_DOMAIN = 'cpe.local';
function toAuthEmail(input){
  input = (input||'').trim().toLowerCase();
  return input.includes('@') ? input : input.replace(/\s+/g,'')+'@'+AUTH_DOMAIN;
}
async function doLogin(){
  const uname = ($('#auth-email').value||'').trim();
  const pass = $('#auth-pass').value||'';
  if(!uname||!pass) return showAuthScreen('Isi username dan password');
  showAuthScreen();
  const {data,error} = await sb.auth.signInWithPassword({email:toAuthEmail(uname),password:pass});
  if(error) return showAuthScreen('Login gagal: username/password salah');
  await afterLogin(data.session);
}
async function deleteDoc(t,id){
  if(role!=='admin') return;
  const d = find(t,id); if(!d) return;
  const cascadePO = [], cascadeSRC = [];
  if(t==='pr' || t==='wr'){
    S.src.filter(s=>s.srcId===id).forEach(s=>{
      S.pos.filter(p=>p.srcId===s.id).forEach(p=>cascadePO.push(p.id));
      cascadeSRC.push(s.id);
    });
  } else if(t==='po'){
    if(d.srcId && S.src.find(s=>s.id===d.srcId)) cascadeSRC.push(d.srcId);
  }
  const extra = cascadePO.length||cascadeSRC.length ? ` Ini juga akan menghapus ${cascadeSRC.length} quotation dan ${cascadePO.length} PO turunannya beserta seluruh dokumen/foto yang diupload di dalamnya.` : '';
  if(!confirm(`Hapus ${d.no} secara permanen?${extra} Tindakan ini tidak bisa dibatalkan.`)) return;
  const table = {pr:'prs', wr:'wrs', src:'src', po:'pos'}[t];
  try{
    if(cascadePO.length){ const r=await sb.from('pos').delete().in('id',cascadePO); if(r.error) throw r.error; }
    if(cascadeSRC.length){ const r=await sb.from('src').delete().in('id',cascadeSRC); if(r.error) throw r.error; }
    const {error} = await sb.from(table).delete().eq('id', id);
    if(error) throw error;
  }catch(e){ toast('Gagal menghapus: '+(e.message||e)); return; }
  cascadePO.forEach(pid=>{ const i=S.pos.findIndex(x=>x.id===pid); if(i>=0) S.pos.splice(i,1); });
  cascadeSRC.forEach(sid=>{ const i=S.src.findIndex(x=>x.id===sid); if(i>=0) S.src.splice(i,1); });
  const arr = coll(t);
  const i = arr.findIndex(x=>x.id===id);
  if(i>=0) arr.splice(i,1);
  closeModal(); render(); toast('Dokumen dan dokumen/foto turunannya dihapus');
}
async function doLogout(){
  const wasGuest = role==='guest';
  if(!confirm(wasGuest?'Keluar dari mode lihat saja?':'Keluar dari akun ini?')) return;
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
  if(!wasGuest) await sb.auth.signOut();
  session=null; myProfile=null; role=null;
  closeModal();
  showAuthScreen();
}
async function guestView(){
  showAuthScreen();
  try{
    await loadFromSupabase();
  }catch(e){
    console.error(e);
    return showAuthScreen('Gagal memuat data untuk mode lihat saja. Cek koneksi internet lalu coba lagi.');
  }
  role = 'guest'; session = null; myProfile = null;
  hideAuthScreen();
  subscribeRealtime();
  tab = 'dashboard'; current = null;
  render();
  toast('Mode lihat saja — tanpa login, tidak bisa membuat/menyetujui dokumen');
}
async function changePassword(){
  const np = prompt('Password baru (minimal 6 karakter):');
  if(np===null) return;
  if(np.length<6) return toast('Password minimal 6 karakter');
  const {error} = await sb.auth.updateUser({password:np});
  if(error) toast('Gagal ganti password: '+error.message); else toast('Password berhasil diganti');
}
async function afterLogin(sess){
  session = sess;
  const {data:prof,error} = await sb.from('profiles').select('*').eq('id',sess.user.id).maybeSingle();
  if(error || !prof){ await sb.auth.signOut(); return showAuthScreen('Akun ini belum terdaftar di sistem. Hubungi admin.'); }
  myProfile = prof; role = prof.role;
  hideAuthScreen();
  await loadFromSupabase();
  subscribeRealtime();
  tab = 'dashboard'; current = null;
  render();
}
let realtimeChannel = null, reloadTimer = null;
function reloadQuiet(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async ()=>{ await loadFromSupabase(); render(); if(current) docModal(current.type,current.id); }, 500);
}
async function manualRefresh(){
  const btn = $('#tb-refresh'); if(btn){ btn.disabled = true; btn.classList.add('spin'); }
  try{
    await loadFromSupabase();
    render();
    if(current) docModal(current.type,current.id);
    toast('Data diperbarui');
  }catch(e){ toast('Gagal memuat ulang data'); }
  if(btn){ btn.disabled = false; btn.classList.remove('spin'); }
}
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel('purchasing-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'prs'},reloadQuiet)
    .on('postgres_changes',{event:'*',schema:'public',table:'wrs'},reloadQuiet)
    .on('postgres_changes',{event:'*',schema:'public',table:'src'},reloadQuiet)
    .on('postgres_changes',{event:'*',schema:'public',table:'pos'},reloadQuiet)
    .on('postgres_changes',{event:'*',schema:'public',table:'signatures'},reloadQuiet)
    .on('postgres_changes',{event:'*',schema:'public',table:'catalog'},reloadQuiet)
    .subscribe();
}
async function boot(){
  const {data:{session:sess}} = await sb.auth.getSession();
  if(sess){ await afterLogin(sess); } else { showAuthScreen(); }
  window.__appBooted = true; // marker for the watchdog script below — reached once a stable screen (login or app) is shown
  sb.auth.onAuthStateChange((event)=>{
    if(event==='SIGNED_OUT'){ session=null; myProfile=null; role=null; showAuthScreen(); }
  });
}

function addSigToPdf(doc,dataUrl,centerX,y,maxW,maxH){
  if(!dataUrl) return;
  try{
    const m=/^data:image\/(png|jpe?g)/i.exec(dataUrl);
    const format = m && /jpe?g/i.test(m[1]) ? 'JPEG' : 'PNG';
    doc.addImage(dataUrl,format,centerX-maxW/2,y,maxW,maxH);
  }catch(e){ /* format gambar tidak didukung jsPDF, lewati diam-diam */ }
}

boot().catch(e=>{ console.error('Gagal boot aplikasi:', e); });

</script>
<script>
// Watchdog independen dari script utama di atas: kalau script utama gagal total (mis. library dari
// CDN seperti Supabase/jsPDF gagal dimuat karena koneksi/jaringan diblokir — termasuk oleh panel
// preview yang jaringannya terbatas), halaman akan diam/muter-muter loading tanpa pesan apa pun.
// Watchdog ini menampilkan pesan error yang jelas kalau aplikasi belum siap dalam beberapa detik.
(function(){
  setTimeout(function(){
    if (window.__appBooted) return; // aplikasi sudah siap (layar login atau halaman utama tampil), tidak perlu apa-apa
    var msg = window.__libsLoaded
      ? 'Aplikasi berhasil memuat library, tapi gagal terhubung ke server (Supabase). Cek koneksi internet Anda, lalu muat ulang halaman.'
      : 'Gagal memuat library yang dibutuhkan (Supabase/jsPDF/Excel) dari internet. Ini sering terjadi bila file dibuka di panel preview yang jaringannya terbatas. Coba unduh file ini lalu buka langsung di browser (Chrome/Edge/Safari), atau pastikan ada koneksi internet.';
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    box.innerHTML = '<div style="max-width:420px;text-align:center">'
      + '<div style="font-size:40px;margin-bottom:12px">⚠️</div>'
      + '<div style="font-weight:700;font-size:16px;margin-bottom:8px;color:#1e2330">Aplikasi tidak bisa dimuat</div>'
      + '<div style="color:#5b6472;font-size:14px;line-height:1.5;margin-bottom:18px">' + msg + '</div>'
      + '<button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer">Muat Ulang Halaman</button>'
      + '</div>';
    document.body.appendChild(box);
  }, 8000);
})();
</script>
